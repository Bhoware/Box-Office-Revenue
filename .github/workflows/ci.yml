name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boxoffice_revenue
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: boxoffice_revenue/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: App imports and loads the model
        run: python -c "import app"

      - name: Prediction smoke test
        run: python tests/test_boxoffice_revenue.py
